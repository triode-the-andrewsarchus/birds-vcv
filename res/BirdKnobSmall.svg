<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <defs>
    <!-- Outer Bezel Gradient -->
    <linearGradient id="bezelGradSm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4e6882"/>
      <stop offset="50%" stop-color="#2a3c4d"/>
      <stop offset="100%" stop-color="#18232e"/>
    </linearGradient>

    <!-- Knob Cap Gradient -->
    <radialGradient id="capGradSm" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#324759"/>
      <stop offset="70%" stop-color="#1a2530"/>
      <stop offset="100%" stop-color="#0f161d"/>
    </radialGradient>

    <!-- Top Highlight -->
    <linearGradient id="hiGradSm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Shadow Ring -->
  <circle cx="11" cy="11.5" r="10" fill="#0b1015" opacity="0.6"/>

  <!-- Outer Bezel -->
  <circle cx="11" cy="11" r="10" fill="url(#bezelGradSm)" stroke="#121a24" stroke-width="0.6"/>

  <!-- Knurled Rim Notch Pattern -->
  <circle cx="11" cy="11" r="9.2" fill="none" stroke="#243342" stroke-width="0.8" stroke-dasharray="1.2,1.2"/>

  <!-- Inner Cap Body -->
  <circle cx="11" cy="11" r="8.2" fill="url(#capGradSm)" stroke="#0d141b" stroke-width="0.5"/>

  <!-- Subtle Top Convex Highlight Arc -->
  <path d="M 4.5 9.5 A 7.5 7.5 0 0 1 17.5 9.5 A 7.2 6.5 0 0 0 4.5 9.5 Z" fill="url(#hiGradSm)"/>

  <!-- Indicator Pointer Notch (12 o'clock) -->
  <rect x="10.2" y="2.5" width="1.6" height="5.5" rx="0.8" fill="#99c1e2"/>
  <rect x="10.5" y="2.8" width="1.0" height="4.5" rx="0.5" fill="#ffffff" opacity="0.8"/>
</svg>
