<svg xmlns="http://www.w3.org/2000/svg" width="16" height="28" viewBox="0 0 16 28">
  <defs>
    <!-- Bezel Gradient -->
    <linearGradient id="swBezel1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4d6780"/>
      <stop offset="50%" stop-color="#283a4a"/>
      <stop offset="100%" stop-color="#15202a"/>
    </linearGradient>

    <!-- Lever Gradient -->
    <linearGradient id="swLever1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d566e"/>
      <stop offset="50%" stop-color="#22313f"/>
      <stop offset="100%" stop-color="#121b24"/>
    </linearGradient>

    <!-- Lever Tip Highlight -->
    <linearGradient id="swTip1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a9bb8"/>
      <stop offset="100%" stop-color="#3a5166"/>
    </linearGradient>

    <!-- Active Indicator Glow -->
    <radialGradient id="swGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#80e0a7"/>
      <stop offset="100%" stop-color="#2ea85f" stop-opacity="0.8"/>
    </radialGradient>
  </defs>

  <!-- Shadow -->
  <rect x="1" y="2" width="14" height="25" rx="3" fill="#090d12" opacity="0.6"/>

  <!-- Outer Bezel -->
  <rect x="1" y="1" width="14" height="25" rx="3" fill="url(#swBezel1)" stroke="#101820" stroke-width="0.6"/>

  <!-- Recessed Slot Track -->
  <rect x="3.5" y="3.5" width="9" height="20" rx="2" fill="#0c1218" stroke="#1d2a36" stroke-width="0.5"/>

  <!-- Active Indicator Light (Lower Slot) -->
  <circle cx="8" cy="20" r="1.6" fill="url(#swGlow1)"/>
  <circle cx="8" cy="20" r="0.8" fill="#ffffff"/>

  <!-- Lever Bat (Up Position - On) -->
  <rect x="4.5" y="5" width="7" height="10" rx="2" fill="url(#swLever1)" stroke="#0b1015" stroke-width="0.5"/>
  <rect x="5.2" y="6" width="5.6" height="4" rx="1.5" fill="url(#swTip1)"/>
</svg>
